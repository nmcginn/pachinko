<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" href="data:," />
    <title>Pachinko</title>
  </head>
  <body>
    <canvas id="board" aria-label="Pachinko board"></canvas>
    <pre id="debug" aria-hidden="true"></pre>
    <div id="reel" role="status" aria-label="Reel">
      <div id="reel-digits">
        <span class="reel-digit">0</span><span class="reel-digit">0</span
        ><span class="reel-digit">0</span>
      </div>
      <div id="reel-holds" aria-label="Held spins">
        <span class="reel-hold"></span><span class="reel-hold"></span><span class="reel-hold"></span
        ><span class="reel-hold"></span>
      </div>
      <div id="reel-status"></div>
    </div>
    <div id="hud">
      <div id="balls" data-balls="">Balls –</div>
    </div>
    <button id="mute" type="button" aria-pressed="false" title="Mute (M)">Sound on</button>
    <div
      id="handle"
      role="slider"
      aria-label="Launch handle: press and turn to fire, or hold space and use the arrow keys"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="50"
      tabindex="0"
    >
      <div id="handle-knob"><div class="handle-mark"></div></div>
      <span id="handle-power">50%</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
